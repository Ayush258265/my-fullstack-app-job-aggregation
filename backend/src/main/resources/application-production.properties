# ============================================
# PRODUCTION CONFIGURATION - AIVEN Database
# ============================================

# Server
server.port=${PORT:8080}

# ============================================
# DATABASE - AIVEN MySQL
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# CORS - Production
# ============================================
cors.allowed.origins=${CORS_ORIGINS:https://jobfinder-frontend.vercel.app}

# ============================================
# GROQ API (Only API Key Needed)
# ============================================
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=${GROQ_MODEL:groq/compound}
groq.mock.mode=false

# ============================================
# LOGGING - Production
# ============================================
logging.level.com.backend=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot=WARN

# ============================================
# INTERVIEW SETTINGS
# ============================================
interview.max.daily=${INTERVIEW_MAX_DAILY:6}
interview.question.time.minutes=${INTERVIEW_QUESTION_TIME:3}
interview.max.free.sessions=${INTERVIEW_MAX_FREE:5}

# ============================================
# ACTUATOR (Health Checks)
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# ============================================
# SPRING BOOT PRODUCTION
# ============================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.jpa.open-in-view=false