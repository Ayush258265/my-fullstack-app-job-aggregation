# ============================================
# APPLICATION EXAMPLE - Copy this to application.properties
# Replace all YOUR_* values with your actual credentials
# DO NOT commit this file with real values!
# ============================================

# Server
server.port=8080

# ============================================
# DATABASE - Local Development
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/jobfinder_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_LOCAL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - Development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================
# JWT (Generate your own secret)
# ============================================
jwt.secret=YOUR_JWT_SECRET_AT_LEAST_32_CHARS
jwt.expiration=86400000

# ============================================
# CORS - Development
# ============================================
cors.allowed.origins=http://localhost:3000,http://localhost:5173,http://localhost:5175

# ============================================
# GROQ API (Get your API key from https://console.groq.com/)
# ============================================
groq.api.key=YOUR_GROQ_API_KEY
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=groq/compound
groq.mock.mode=true

# ============================================
# LOGGING - Development
# ============================================
logging.level.com.backend=DEBUG
logging.level.org.hibernate=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# ============================================
# INTERVIEW SETTINGS
# ============================================
interview.max.daily=6
interview.question.time.minutes=3
interview.max.free.sessions=5

# ============================================
# ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info